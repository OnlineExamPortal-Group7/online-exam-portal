{% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
      <div class="p-3.5 rounded-xl border text-xs font-semibold flex items-center gap-2.5 {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border-rose-200{% elif message.tags == 'success' %}bg-emerald-50 text-emerald-800 border-emerald-200{% else %}bg-indigo-50 text-indigo-800 border-indigo-200{% endif %}">
        <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
