{% extends "base.html" %}

{% block title %}Password Changed - Online Exam Portal{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
  <div class="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-5">
    <i data-lucide="check-circle-2" class="w-7 h-7"></i>
  </div>

  <h2 class="text-2xl font-bold tracking-tight text-slate-900">Password successfully updated</h2>
  <p class="mt-2 text-sm text-slate-600 leading-relaxed max-w-sm mx-auto">
    Your password has been changed. You can now sign in with your new credentials.
  </p>

  <div class="mt-6 pt-6 border-t border-slate-100">
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-full text-xs font-semibold">
      Proceed to login &rarr;
    </a>
  </div>
</div>
{% endblock %}
