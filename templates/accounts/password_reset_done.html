{% extends "base.html" %}

{% block title %}Check Your Email - Online Exam Portal{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
  <div class="w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-5">
    <i data-lucide="mail-check" class="w-7 h-7"></i>
  </div>

  <h2 class="text-2xl font-bold tracking-tight text-slate-900">Check your email</h2>
  <p class="mt-2 text-sm text-slate-600 leading-relaxed max-w-sm mx-auto">
    If an account matches that email address, password reset instructions have been dispatched. Please check your inbox and spam folder.
  </p>

  <div class="mt-6 pt-6 border-t border-slate-100">
    <a href="{% url 'accounts:login' %}" class="btn btn-secondary w-full text-xs font-semibold">
      Return to login
    </a>
  </div>
</div>
{% endblock %}
