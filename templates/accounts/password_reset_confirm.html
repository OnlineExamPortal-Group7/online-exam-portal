{% extends "base.html" %}
{% block content %}
<h2>Choose a new password</h2>
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change password</button>
    </form>
{% else %}
    <p>This password-reset link is invalid or has expired. Request a new link.</p>
{% endif %}
{% endblock %}
