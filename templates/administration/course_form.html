{% extends "base.html" %}
{% block title %}{% if object %}Edit course{% else %}Create course{% endif %}{% endblock %}
{% block content %}
<h2>{% if object %}Edit {{ object.code }}{% else %}Create course{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% if object %}Save course{% else %}Create course{% endif %}</button>
</form>
<p><a href="{% url 'administration:course_list' %}">Back to courses</a></p>
{% endblock %}
